<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 50 BingX · Variación 4h</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e5e7eb;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    h1 { font-size: 1.45rem; font-weight: 700; }
    .meta { font-size: 0.88rem; color: #9ca3af; margin-top: 3px; }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1d27;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    th, td {
      padding: 11px 14px;
      text-align: left;
      border-bottom: 1px solid #2d3142;
    }
    th {
      background: #252836;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9ca3af;
      position: sticky;
      top: 0;
    }
    tr:hover { background: #22263a; }
    .rank { color: #6b7280; font-weight: 600; width: 42px; }
    .symbol { font-weight: 700; }
    .price { font-variant-numeric: tabular-nums; }
    .positive { color: #22c55e; }
    .negative { color: #ef4444; }
    .volume { color: #9ca3af; font-size: 0.9rem; }
    .loading, .error {
      text-align: center;
      padding: 50px 20px;
      color: #9ca3af;
    }
    .error { color: #ef4444; }
    @media (max-width: 600px) {
      th, td { padding: 9px 7px; font-size: 0.88rem; }
      .hide-mobile { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Top 50 BingX por Volumen</h1>
        <div class="meta" id="lastUpdate">Cargando...</div>
      </div>
      <button class="btn" id="refreshBtn" onclick="loadData()">Actualizar</button>
    </header>

    <div id="content">
      <div class="loading">Cargando top 50 de BingX...</div>
    </div>
  </div>

  <script>
    function formatPrice(p) {
      const n = parseFloat(p);
      if (n >= 1000) return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (n >= 1) return n.toFixed(4);
      if (n >= 0.01) return n.toFixed(6);
      return n.toFixed(8);
    }

    function formatVolume(v) {
      const n = parseFloat(v);
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return n.toFixed(0);
    }

    function formatChange(num) {
      if (num === null || isNaN(num)) return '<span style="color:#6b7280">—</span>';
      const cls = num >= 0 ? 'positive' : 'negative';
      const sign = num > 0 ? '+' : '';
      return `<span class="${cls}">${sign}${num.toFixed(2)}%</span>`;
    }

    async function loadData() {
      const btn = document.getElementById('refreshBtn');
      const content = document.getElementById('content');
      btn.disabled = true;
      content.innerHTML = '<div class="loading">Cargando top 50 de BingX...</div>';

      try {
        const res = await fetch('/api/top50');
        const json = await res.json();

        if (!json.ok) throw new Error(json.error || 'Error desconocido');

        const data = json.data;

        let html = `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Par</th>
                <th>Precio</th>
                <th>Var. 4h</th>
                <th class="hide-mobile">Volumen 24h</th>
              </tr>
            </thead>
            <tbody>
        `;

        data.forEach((t, i) => {
          html += `
            <tr>
              <td class="rank">${i + 1}</td>
              <td class="symbol">${t.symbol}</td>
              <td class="price">$${formatPrice(t.lastPrice)}</td>
              <td>${formatChange(t.change4h)}</td>
              <td class="volume hide-mobile">$${formatVolume(t.quoteVolume)}</td>
            </tr>
          `;
        });

        html += '</tbody></table>';
        content.innerHTML = html;

        const now = new Date().toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' });
        const cached = json.cached ? ' (cache)' : '';
        document.getElementById('lastUpdate').textContent =
          `Actualizado: ${now}${cached} · Fuente: BingX Spot · Var. desde inicio de la vela 4h`;
      } catch (err) {
        content.innerHTML = `<div class="error">Error: ${err.message}<br><br>Intentá de nuevo en unos segundos.</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    loadData();
    // Auto-refresh cada 2 minutos
    setInterval(loadData, 120000);
  </script>
</body>
</html>
