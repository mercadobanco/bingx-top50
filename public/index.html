<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top BingX · Spot / Perpetual</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e5e7eb;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; font-weight: 700; }
    .meta { font-size: 0.85rem; color: #9ca3af; margin-top: 3px; }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: #1a1d27;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .filters label {
      font-size: 0.85rem;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filters input, .filters select {
      background: #0f1117;
      border: 1px solid #2d3142;
      color: #e5e7eb;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }
    .filters input:focus, .filters select:focus { border-color: #3b82f6; }

    .status {
      font-size: 0.8rem;
      color: #60a5fa;
      margin-bottom: 10px;
      min-height: 1.2em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1d27;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    th, td {
      padding: 10px 11px;
      text-align: left;
      border-bottom: 1px solid #2d3142;
    }
    th {
      background: #252836;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9ca3af;
      position: sticky;
      top: 0;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { color: #e5e7eb; }
    th .arrow { margin-left: 3px; opacity: 0.5; }
    th.active .arrow { opacity: 1; color: #3b82f6; }
    tr:hover { background: #22263a; }
    .rank { color: #6b7280; font-weight: 600; width: 36px; }
    .symbol { font-weight: 700; }
    .badge {
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 6px;
      font-weight: 600;
      vertical-align: middle;
    }
    .badge-crypto { background: #1e3a5f; color: #93c5fd; }
    .badge-tradfi { background: #3b2f1a; color: #fbbf24; }
    .price { font-variant-numeric: tabular-nums; }
    .positive { color: #22c55e; }
    .negative { color: #ef4444; }
    .muted { color: #9ca3af; font-size: 0.9rem; }
    .loading, .error, .empty {
      text-align: center;
      padding: 50px 20px;
      color: #9ca3af;
    }
    .error { color: #ef4444; }

    @media (max-width: 800px) {
      th, td { padding: 8px 5px; font-size: 0.82rem; }
      .hide-mobile { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Top BingX por Volumen</h1>
        <div class="meta" id="lastUpdate">Cargando...</div>
      </div>
      <button class="btn" id="refreshBtn" onclick="fetchData()">Actualizar</button>
    </header>

    <div class="filters">
      <label>
        Mercado:
        <select id="market">
          <option value="spot">Spot</option>
          <option value="swap">Futuros (Perpetual)</option>
        </select>
      </label>
      <label>
        Tipo:
        <select id="assetType">
          <option value="all">Todo</option>
          <option value="crypto">Criptos</option>
          <option value="tradfi">TradFi</option>
        </select>
      </label>
      <label>
        Vol en USD:
        <select id="minVolume">
          <option value="0">Todo</option>
          <option value="1000000">1M USD+</option>
        </select>
      </label>
      <label>
        Ordenar por:
        <select id="sortBy">
          <option value="volume">Volumen</option>
          <option value="change1h">Var. 1h</option>
          <option value="change4h">Var. 4h</option>
          <option value="change24h">Var. 24h</option>
          <option value="spread">Spread</option>
          <option value="depth">Depth ±2%</option>
          <option value="price">Precio</option>
          <option value="symbol">Par</option>
        </select>
      </label>
      <label>
        Dirección:
        <select id="sortDir">
          <option value="desc">Mayor → Menor</option>
          <option value="asc">Menor → Mayor</option>
        </select>
      </label>
    </div>

    <div class="status" id="status"></div>
    <div id="content">
      <div class="loading">Cargando datos de BingX...</div>
    </div>
  </div>

  <script>
    let rawData = [];
    let sortKey = 'volume';
    let sortDir = 'desc';
    let currentMarket = 'spot';

    function formatPrice(p) {
      const n = parseFloat(p);
      if (n >= 1000) return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (n >= 1) return n.toFixed(4);
      if (n >= 0.01) return n.toFixed(6);
      return n.toFixed(8);
    }

    function formatVolume(v) {
      const n = parseFloat(v);
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return n.toFixed(0);
    }

    function formatChange(num) {
      if (num === null || num === undefined || isNaN(num)) return '<span style="color:#6b7280">—</span>';
      const cls = num >= 0 ? 'positive' : 'negative';
      const sign = num > 0 ? '+' : '';
      return `<span class="${cls}">${sign}${num.toFixed(2)}%</span>`;
    }

    function formatSpread(num) {
      if (num === null || num === undefined || isNaN(num)) return '<span style="color:#6b7280">—</span>';
      return `<span class="muted">${num.toFixed(3)}%</span>`;
    }

    function formatDepth(num) {
      if (num === null || num === undefined || isNaN(num)) return '<span style="color:#6b7280">—</span>';
      return `<span class="muted">$${formatVolume(num)}</span>`;
    }

    function getFilteredSorted() {
      const minVol = parseFloat(document.getElementById('minVolume').value) || 0;
      const typeFilter = document.getElementById('assetType').value;

      let list = rawData.filter(t => {
        if (t.quoteVolume < minVol) return false;
        if (typeFilter === 'crypto' && t.assetType !== 'crypto') return false;
        if (typeFilter === 'tradfi' && t.assetType !== 'tradfi') return false;
        return true;
      });

      list.sort((a, b) => {
        let va, vb;
        switch (sortKey) {
          case 'volume':    va = a.quoteVolume; vb = b.quoteVolume; break;
          case 'change1h':  va = a.change1h ?? -Infinity; vb = b.change1h ?? -Infinity; break;
          case 'change4h':  va = a.change4h ?? -Infinity; vb = b.change4h ?? -Infinity; break;
          case 'change24h': va = a.change24h ?? -Infinity; vb = b.change24h ?? -Infinity; break;
          case 'spread':    va = a.spreadPct ?? Infinity; vb = b.spreadPct ?? Infinity; break;
          case 'depth':     va = a.depth2pct ?? -Infinity; vb = b.depth2pct ?? -Infinity; break;
          case 'price':     va = parseFloat(a.lastPrice); vb = parseFloat(b.lastPrice); break;
          case 'symbol':    va = a.symbol; vb = b.symbol; break;
          default:          va = a.quoteVolume; vb = b.quoteVolume;
        }
        if (typeof va === 'string') {
          return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        }
        return sortDir === 'asc' ? va - vb : vb - va;
      });
      return list;
    }

    function render() {
      const list = getFilteredSorted();
      const content = document.getElementById('content');

      if (!list.length) {
        content.innerHTML = '<div class="empty">No hay pares con esos filtros.</div>';
        return;
      }

      const arrow = (key) => {
        if (sortKey !== key) return '<span class="arrow">↕</span>';
        return sortDir === 'desc' ? '<span class="arrow">↓</span>' : '<span class="arrow">↑</span>';
      };

      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th class="${sortKey==='symbol'?'active':''}" onclick="setSort('symbol')">Par ${arrow('symbol')}</th>
              <th class="${sortKey==='price'?'active':''}" onclick="setSort('price')">Precio ${arrow('price')}</th>
              <th class="${sortKey==='change1h'?'active':''}" onclick="setSort('change1h')">1h ${arrow('change1h')}</th>
              <th class="${sortKey==='change4h'?'active':''}" onclick="setSort('change4h')">4h ${arrow('change4h')}</th>
              <th class="${sortKey==='change24h'?'active':''}" onclick="setSort('change24h')">24h ${arrow('change24h')}</th>
              <th class="hide-mobile ${sortKey==='spread'?'active':''}" onclick="setSort('spread')">Spread ${arrow('spread')}</th>
              <th class="hide-mobile ${sortKey==='depth'?'active':''}" onclick="setSort('depth')">Depth ±2% ${arrow('depth')}</th>
              <th class="hide-mobile ${sortKey==='volume'?'active':''}" onclick="setSort('volume')">Volumen ${arrow('volume')}</th>
            </tr>
          </thead>
          <tbody>
      `;

      list.forEach((t, i) => {
        const badge = t.assetType === 'tradfi'
          ? '<span class="badge badge-tradfi">TF</span>'
          : '<span class="badge badge-crypto">C</span>';
        html += `
          <tr>
            <td class="rank">${i + 1}</td>
            <td class="symbol">${t.symbol}${badge}</td>
            <td class="price">$${formatPrice(t.lastPrice)}</td>
            <td>${formatChange(t.change1h)}</td>
            <td>${formatChange(t.change4h)}</td>
            <td>${formatChange(t.change24h)}</td>
            <td class="hide-mobile">${formatSpread(t.spreadPct)}</td>
            <td class="hide-mobile">${formatDepth(t.depth2pct)}</td>
            <td class="muted hide-mobile">$${formatVolume(t.quoteVolume)}</td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      content.innerHTML = html;
    }

    function setSort(key) {
      if (sortKey === key) {
        sortDir = sortDir === 'desc' ? 'asc' : 'desc';
      } else {
        sortKey = key;
        sortDir = (key === 'symbol' || key === 'spread') ? 'asc' : 'desc';
      }
      document.getElementById('sortBy').value = sortKey;
      document.getElementById('sortDir').value = sortDir;
      render();
    }

    async function enrichInBackground(market) {
      const status = document.getElementById('status');
      status.textContent = 'Calculando 1h, 4h y liquidez (top 25)...';
      try {
        const res = await fetch(`/api/enrich?market=${market}`);
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Error al enriquecer');
        if (market !== currentMarket) return;
        rawData = json.data;
        render();
        status.textContent = '1h / 4h / liquidez listos';
        setTimeout(() => {
          if (status.textContent.includes('listos')) status.textContent = '';
        }, 2500);
      } catch (err) {
        status.textContent = 'No se pudieron cargar 1h/4h/liquidez (se muestran 24h)';
        console.error(err);
      }
    }

    async function fetchData() {
      const btn = document.getElementById('refreshBtn');
      const content = document.getElementById('content');
      const status = document.getElementById('status');
      const market = document.getElementById('market').value;
      currentMarket = market;

      btn.disabled = true;
      status.textContent = '';
      content.innerHTML = `<div class="loading">Cargando ${market === 'spot' ? 'Spot' : 'Futuros Perpetual'}...</div>`;

      try {
        const res = await fetch(`/api/top?market=${market}`);
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Error desconocido');

        rawData = json.data;

        const now = new Date().toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' });
        const cached = json.cached ? ' (cache)' : '';
        const label = market === 'spot' ? 'Spot' : 'Futuros Perpetual';
        document.getElementById('lastUpdate').textContent =
          `Actualizado: ${now}${cached} · BingX ${label}`;

        render();
        btn.disabled = false;

        if (!json.enriched) {
          enrichInBackground(market);
        }
      } catch (err) {
        content.innerHTML = `<div class="error">Error: ${err.message}<br><br>Reintentá con Actualizar.</div>`;
        btn.disabled = false;
      }
    }

    document.getElementById('minVolume').addEventListener('change', render);
    document.getElementById('assetType').addEventListener('change', render);
    document.getElementById('sortBy').addEventListener('change', (e) => {
      sortKey = e.target.value;
      render();
    });
    document.getElementById('sortDir').addEventListener('change', (e) => {
      sortDir = e.target.value;
      render();
    });
    document.getElementById('market').addEventListener('change', fetchData);

    // Solo carga inicial — sin auto-refresh
    fetchData();
  </script>
</body>
</html>
